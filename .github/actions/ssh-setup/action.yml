name: "SSH Setup"
description: "Set up SSH agent and known hosts"
inputs:
  ssh-private-key:
    description: "SSH private key"
    required: true
  vps-host:
    description: "VPS host for known_hosts"
    required: true
runs:
  using: "composite"
  steps:
    - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H "${{ inputs.vps-host }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      shell: bash
