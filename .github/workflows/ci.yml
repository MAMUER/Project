name: CI/CD Pipeline
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/dependabot.yml"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "configs/**"
      - "scripts/**"
      - "models/**"
      - "deployments/**"
      - ".dockerignore"
      - "db/migrations/**"
      - "datasets/**"
      - "*.py"
      - "web/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/dependabot.yml"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "configs/**"
      - "scripts/**"
      - "models/**"
      - "deployments/**"
      - ".dockerignore"
      - "db/migrations/**"
      - "datasets/**"
      - "*.py"
      - "web/**"
  schedule:
    - cron: "0 0 * * 1" # Weekly Monday midnight
    - cron: "0 9 1 * *" # Monthly dependency update
    - cron: "0 9 1 1,4,7,10 *" # Quarterly vulncheck
    - cron: "34 9 * * 3" # CodeQL weekly
    - cron: "16 11 * * 3" # OSV weekly
    - cron: "25 13 * * 1" # Semgrep weekly
    - cron: "0 0 * * 0" # Fuzz tests weekly
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Select execution mode"
        required: false
        type: choice
        options: [full, maintenance, recreate-cluster]
      maintenance_type:
        description: "For maintenance mode: update|audit|vulncheck"
        required: false
        type: choice
        options: [update, audit, vulncheck]
        default: "update"
  release:
    types: [created]
  issues:
    types: [opened, labeled, unlabeled]

env:
  GO_VERSION: "1.26.5"
  REGISTRY: ghcr.io
  FITPULSE_DOMAIN: "fittpulse.duckdns.org"

jobs:
  # ============================================================================
  # DETECT CHANGES
  # ============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'release' && github.event_name != 'issues'
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      user: ${{ steps.filter.outputs.user }}
      biometric: ${{ steps.filter.outputs.biometric }}
      training: ${{ steps.filter.outputs.training }}
      device: ${{ steps.filter.outputs.device }}
      ml: ${{ steps.filter.outputs.ml }}
      k8s: ${{ steps.filter.outputs.k8s }}
      workflow: ${{ steps.filter.outputs.workflow }}
      db: ${{ steps.filter.outputs.db }}
      infra: ${{ steps.filter.outputs.infra }}
      any_code: ${{ steps.filter.outputs.any_code }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # originally: v4
        id: filter
        with:
          filters: |
            gateway:
              - 'cmd/gateway/**'
              - 'internal/gateway/**'
              - 'api/proto/gateway/**'
            user:
              - 'cmd/user-service/**'
              - 'internal/user/**'
            biometric:
              - 'cmd/biometric-service/**'
              - 'internal/biometric/**'
            training:
              - 'cmd/training-service/**'
              - 'internal/training/**'
            device:
              - 'cmd/device-aggregator/**'
              - 'internal/device/**'
            classifier:
              - 'cmd/classifier/**'
              - 'models/**'
              - 'datasets/**'
            k8s:
              - 'configs/k8s/**'
            workflow:
              - '.github/workflows/**'
            db:
              - 'db/migrations/**'
              - 'configs/k8s/base/jobs/**'
            infra:
              - 'scripts/**'
              - 'deploy/**'
              - 'Makefile'
            any_code:
              - 'cmd/**'
              - 'internal/**'
              - 'api/**'
              - 'go.mod'
              - 'go.sum'
              - '*.py'
            frontend:
              - 'web/**'
              - '!web/node_modules/**'
              - '!web/dist/**'

  # ============================================================================
  # ISSUE AUTOMATION
  # ============================================================================
  issue-automation:
    name: Issue Automation
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Add triage label
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-triage']
            });
      - name: Add component labels
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log('No issue payload, skipping component labels');
              return;
            }
            const body = issue.body || '';
            const labels = [];
            if (body.toLowerCase().includes('fitbit') || body.includes('withings')) {
              labels.push('device-integration');
            }
            if (body.toLowerCase().includes('oauth') || body.includes('auth')) {
              labels.push('authentication');
            }
            if (body.toLowerCase().includes('webhook')) {
              labels.push('webhook');
            }
            if (body.toLowerCase().includes('smtp') || body.includes('email')) {
              labels.push('email-service');
            }
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }
      - name: Assign based on component
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log('No issue payload, skipping assignment');
              return;
            }
            const body = issue.body || '';
            const title = issue.title.toLowerCase();
            const assignments = {
              'gateway': ['@MAMUER'],
              'user service': ['@MAMUER'],
              'biometric': ['@MAMUER'],
              'training': ['@MAMUER'],
              'device': ['@MAMUER'],
              'ml ': ['@MAMUER'],
              'frontend': ['@MAMUER'],
              'k8s': ['@MAMUER'],
              'docker': ['@MAMUER'],
              'ci/cd': ['@MAMUER'],
            };
            for (const [keyword, assignees] of Object.entries(assignments)) {
              if (body.toLowerCase().includes(keyword) || title.includes(keyword)) {
                for (const assignee of assignees) {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    assignees: [assignee.replace('@', '')]
                  });
                }
                break;
              }
            }
      - name: Welcome new contributors
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log('No issue payload, skipping welcome comment');
              return;
            }
            const author = issue.user.login;
            const isFirst = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: author,
              per_page: 1
            }).then(res => res.data.length === 1);
            if (isFirst) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `👋 Привет, @${author}! Спасибо за первое сообщение об ошибке/идею.\nМы проверим ваш репорт в ближайшее время. Если у вас есть дополнительные детали — добавляйте в комментарии.`
              });
            }
      - name: Security issue handling
        if: |
          github.event_name == 'issues' &&
          (github.event.action == 'opened' || github.event.action == 'labeled')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log('No issue payload, skipping security handling');
              return;
            }
            const labels = issue.labels.map(l => l.name.toLowerCase());
            const isSecurity = labels.includes('security') ||
                              labels.includes('vulnerability') ||
                              issue.title.toLowerCase().includes('security') ||
                              issue.title.toLowerCase().includes('vulnerability');

            if (isSecurity) {
              console.log('Security issue detected:', issue.number);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['security']
              });
            }
      - name: Notify Telegram on critical
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          ISSUE_TITLE: "${{ github.event.issue.title }}"
          ISSUE_NUMBER: "${{ github.event.issue.number }}"
          ISSUE_HTML_URL: "${{ github.event.issue.html_url }}"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/ci/ci-helpers.sh send_telegram
  # ============================================================================
  # FRONTEND CHECKS
  # ============================================================================
  frontend:
    name: Frontend (Lint + Test + Build)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # originally: v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ci-helpers.sh" install_dependencies
        working-directory: web
      - name: Lint frontend
        run: npm run lint
        working-directory: web
      - name: Run frontend tests
        run: npm run test
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web

  # ============================================================================
  # VALIDATE WORKFLOW
  # ============================================================================
  validate-workflow:
    name: Validate Workflow Syntax
    runs-on: ubuntu-latest
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - name: Validate workflow syntax
        run: bash scripts/ci/ci-helpers.sh validate_workflow
  # ============================================================================
  # DOCKERFILE LINT
  # ============================================================================
  dockerfile-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Run Hadolint on all Dockerfiles
        run: bash scripts/ci/ci-helpers.sh run_hadolint
  # ============================================================================
  # SUPER LINTER
  # ============================================================================
  super-linter:
    name: Super Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    needs: [validate-workflow]
    steps:
      - run: git config --global init.defaultBranch main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - name: Lint Code Base
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918
        env:
          GO_VERSION: 1.26.5
          REGISTRY: ghcr.io
          FITPULSE_DOMAIN: fittpulse.duckdns.org
          PYTHON_BLACK_VERSION: "26.5.1"
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_COMMIT_STATUS_ENABLED: false
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true
          SAVE_SUPER_LINTER_SUMMARY: true
          FILTER_REGEX_EXCLUDE: '(\.github/workflows/.*|.*\.ya?ml$|vendor/.*|bin/.*)'
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_ISORT: true
          VALIDATE_PYTHON_MYPY: true
          VALIDATE_YAML: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_JUPYTER: "false"
          JUPYTER_NBQA_BLACK: "false"
          JUPYTER_NBQA_FLAKE8: "false"
          JUPYTER_NBQA_ISORT: "false"
          JUPYTER_NBQA_MYPY: "false"
          JUPYTER_NBQA_PYLINT: "false"
          JUPYTER_NBQA_RUFF: "false"
          PYTHON_MYPY_ARGS: "--namespace-packages --explicit-package-bases --exclude cmd/ml_generator/"

  # ============================================================================
  # CODEQL ANALYSIS
  # ============================================================================
  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    needs: [validate-workflow]
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - run: git config --global init.defaultBranch main
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql-config.yml
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          category: "/language:${{matrix.language}}"
          output: sarif-results
          upload: failure-only
      - name: Show CodeQL diagnostics
        if: always()
        run: bash scripts/ci/ci-helpers.sh show_codeql_diagnostics
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: sarif-results
          category: codeql-${{ matrix.language }}
          wait-for-processing: true

  # ============================================================================
  # DEPENDENCY REVIEW
  # ============================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - run: git config --global init.defaultBranch main
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # originally: v5
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}

  # ============================================================================
  # KUBESCAPE
  # ============================================================================
  kubescape:
    name: Kubescape K8s Scan
    runs-on: ubuntu-latest
    needs: [validate-workflow]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - run: git config --global init.defaultBranch main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Install Kubescape
        run: bash scripts/ci/security.sh install_tools
      - name: Run Kubescape scan
        run: bash scripts/ci/security.sh run_kubescape
      - name: Upload Kubescape results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        if: always() && hashFiles('sarif-results/kubescape-results.sarif') != ''
        with:
          sarif_file: sarif-results/kubescape-results.sarif
          category: kubescape

  # ============================================================================
  # SEMGREP
  # ============================================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: [validate-workflow]
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Install Semgrep
        run: "pip install --only-binary :all: 'semgrep==1.172.0'"
      - name: Run Semgrep scan
        run: bash scripts/ci/security.sh run_semgrep
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: sarif-results/semgrep-results.sarif
          category: semgrep

  # ============================================================================
  # OSV SCANNER
  # ============================================================================
  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    needs: [validate-workflow]
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Run OSV Scanner (Go dependencies)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: -r ./ --config .osv-scanner.toml --experimental-exclude=cmd/ml_generator
      - name: Run OSV Scanner (Python requirements)

        run: bash scripts/ci/security.sh run_osv_python_requirements
  # ============================================================================
  # FUZZ TESTS
  # ============================================================================
  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    needs: [validate-workflow]
    permissions:
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # originally: v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run fuzz tests
        run: bash scripts/ci/test.sh run_fuzz_tests
  # ============================================================================
  # OSV AUDIT (manual)
  # ============================================================================
  osv-audit:
    name: OSV Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # originally: v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install osv-scanner
        run: bash scripts/ci/security.sh install_tools
      - name: Run osv-scanner
        run: bash scripts/ci/security.sh run_osv_scanner
  # ============================================================================
  # SECURITY SCAN
  # ============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [validate-workflow, dockerfile-lint]
    timeout-minutes: 45
    permissions:
      security-events: write
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # originally: v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install security tools
        run: bash scripts/ci/security.sh install_tools
      - name: Run gosec SAST scanner
        run: bash scripts/ci/security.sh run_gosec
      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        if: always()
        with:
          sarif_file: sarif-results/gosec.sarif
          category: gosec
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run govulncheck
        run: bash scripts/ci/security.sh run_govulncheck
      - name: Run Trivy config scan (misconfigurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.73.0
          trivy-config: trivy.yaml
          trivyignores: .trivyignore
          scan-type: "config"
          scanners: "misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          skip-dirs: "configs/k8s/overlays/production"
        env:
          TRIVY_SKIP_VERSION_CHECK: true
      - name: Install system dependencies for canvas
        run: sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
      - name: Install frontend dependencies for Trivy
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ci-helpers.sh" install_dependencies
        working-directory: web

      - name: Install Python dependencies for Trivy
        run: bash scripts/ci/ci-helpers.sh install_python_deps
      - name: Run Trivy filesystem scan (vulnerabilities + secrets + misconfig)
        id: trivy-fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.73.0
          trivy-config: trivy.yaml
          trivyignores: .trivyignore
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          skip-dirs: "configs/k8s/overlays/production"
          scan-ref: "."
          ignore-unfixed: false
          vuln-type: "os,library"
          format: "sarif"
          output: "sarif-results/trivy-fs.sarif"
          cache-dir: "/home/runner/work/FitPulse/FitPulse/.cache/trivy"
          list-all-pkgs: false
          cache: true
          skip-setup-trivy: false
          hide-progress: true
        env:
          TRIVY_SKIP_VERSION_CHECK: true
          TRIVY_SKIP_PIP: true
          TRIVY_SKIP_DB_UPDATE: false
      - name: Upload Trivy results
        if: always() && hashFiles('sarif-results/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: sarif-results/trivy-fs.sarif
          category: trivy-fs
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Gitleaks
        run: bash scripts/ci/security.sh install_tools
      - name: Run Gitleaks secret scan
        run: bash scripts/ci/security.sh run_gitleaks
      - name: Upload Gitleaks results
        if: always() && hashFiles('sarif-results/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: sarif-results/gitleaks.sarif
          category: gitleaks
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install TruffleHog
        run: bash scripts/ci/security.sh install_tools
      - name: Run TruffleHog secret scan
        run: bash scripts/ci/security.sh run_trufflehog
      - name: Install syft
        run: bash scripts/ci/security.sh install_tools
      - name: Generate SBOM with syft
        run: bash scripts/ci/security.sh generate_sbom
      - name: Security Gate — enforce quality thresholds
        run: bash scripts/ci/security.sh security_gate
  # ============================================================================
  # SONARCLOUD ANALYSIS
  # ============================================================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [security-scan, check, super-linter]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # originally: v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # originally: v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install system dependencies for canvas
        run: sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
      - name: Install frontend dependencies
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ci-helpers.sh" install_dependencies
        working-directory: web
      - name: Run tests and collect coverage
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ci-helpers.sh" run_coverage
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=mamuer
            -Dsonar.projectKey=fitness-platform
            -Dsonar.sources=cmd,internal,api,web/src
            -Dsonar.tests=cmd,internal,web/src
            -Dsonar.test.inclusions=**/*_test.go,**/*.test.jsx,**/*.test.js
            -Dsonar.exclusions=api/gen/**,web/dist/**,web/node_modules/**,mocks/**,**/*_test.go,**/*.test.jsx,**/*.test.js,**/swagger.yaml,**/openapi.yaml,**/*.proto,**/*.pb.go
            -Dsonar.coverage.exclusions=api/gen/**,web/dist/**,web/node_modules/**,mocks/**,cmd/ml-classifier/**,cmd/device-emulator/**,**/swagger.yaml,**/openapi.yaml,**/*.proto,**/*.pb.go,cmd/ml_generator/main.py,cmd/**/main.go,web/src/main.jsx,web/src/App.jsx,web/src/index.css,web/src/test/setup.js
            -Dsonar.go.coverage.reportPaths=coverage/coverage.out
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  # ============================================================================
  # POLICY AS CODE — CONVENTIONAL COMMITS
  # ============================================================================
  conventional-commits:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    needs: [validate-workflow]
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - name: Check conventional commits on main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci/ci-helpers.sh check_commits
  # ============================================================================
  # KUBE-BENCH — CIS BENCHMARK
  # ============================================================================
  kube-bench:
    name: Kube-Bench CIS Benchmark
    runs-on: ubuntu-latest
    needs: [validate-workflow]
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Run kube-bench against cluster (if available)

        run: bash scripts/ci/security.sh run_kube_bench
  # ============================================================================
  # KUBE-HUNTER — PENETRATION TESTING
  # ============================================================================
  kube-hunter:
    name: Kube-Hunter Penetration Test
    runs-on: ubuntu-latest
    needs: [validate-workflow]
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Run kube-hunter (passive scan)

        run: bash scripts/ci/security.sh run_kube_hunter
  # ============================================================================
  # CHECKOV — IaC SECURITY SCANNER
  # ============================================================================
  checkov:
    name: Checkov IaC Scanner
    runs-on: ubuntu-latest
    needs: [validate-workflow]
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Run Checkov scan

        run: bash scripts/ci/security.sh run_checkov
      - name: Upload Checkov SARIF
        if: always() && hashFiles('sarif-results/checkov-results.sarif') != ''

        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: sarif-results/checkov-results.sarif
          category: checkov

  # ============================================================================
  # COSIGN VERIFY — IMAGE SIGNATURE VERIFICATION
  # ============================================================================
  cosign-verify:
    name: Cosign Verify Images
    runs-on: ubuntu-latest
    needs: [docker, validate-workflow]
    if: github.event_name == 'pull_request'
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # originally: v4.1.2
      - name: Download cosign public key
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: bash scripts/ci/security.sh download_cosign_public_key
      - name: Verify Docker image signatures
        env:
          IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/security.sh verify_cosign
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/cosign-keys

  # ============================================================================
  # MAKE CHECK
  # ============================================================================
  check:
    name: Make Check (Lint + Build)
    runs-on: ubuntu-latest
    needs: [validate-workflow, dockerfile-lint]
    timeout-minutes: 30
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # originally: v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install golangci-lint
        run: bash scripts/ci/ci-helpers.sh install_golangci_lint
      - name: Tidy Go modules
        run: make tidy
      - name: Format Go code
        run: make fmt
      - name: Run go vet
        run: make vet
      - name: Update Go imports
        run: make imports
      - name: Run golangci-lint
        run: make lint
      - name: Install system dependencies for canvas
        run: sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
      - name: Install frontend dependencies
        run: make frontend-install
      - name: Lint frontend
        run: make frontend-lint
      - name: Build frontend
        run: make frontend-build

  # ============================================================================
  # BUILD BINARIES
  # ============================================================================
  binary_build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [detect-changes, check, frontend, conventional-commits]
    timeout-minutes: 30
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # originally: v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build Go services (parallel)
        run: bash scripts/ci/build-push.sh build_go_binaries
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # originally: v7
        with:
          name: binaries
          path: bin/
          retention-days: 1

  # ============================================================================
  # DOCKER BUILD & PUSH
  # ============================================================================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [binary_build, security-scan]
    timeout-minutes: 60
    permissions:
      packages: write
      security-events: write
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # originally: v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # originally: v4
      - name: Build and push Go services
        run: bash scripts/ci/build-push.sh build_go_services
      - name: Build and push ML images (if models exist)
        run: bash scripts/ci/build-push.sh build_ml_images
      - name: Build and push CRS updater image
        run: bash scripts/ci/build-push.sh build_crs_updater
      - name: Scan gateway image with Trivy
        id: trivy-image

        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.73.0
          trivy-config: trivy.yaml
          trivyignores: .trivyignore
          image-ref: "${{ env.REGISTRY }}/mamuer/project/gateway:${{ steps.sha.outputs.short_sha }}"
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          scanners: "vuln,secret"
        env:
          TRIVY_SKIP_VERSION_CHECK: true
      - name: Upload Trivy image results
        if: always() && hashFiles('trivy-image.sarif') != ''

        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: trivy-image.sarif
          category: trivy-docker
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # originally: v4.1.2
      - name: Sign Docker images with cosign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ steps.sha.outputs.short_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/security.sh sign_images
  # ============================================================================
  # SLSA PROVENANCE
  # ============================================================================
  slsa-provenance:
    name: SLSA Provenance
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Build artifacts
        run: bash scripts/ci/build-push.sh build_artifacts
      - name: Generate subject for provenance
        id: hash
        run: bash scripts/ci/ci-helpers.sh generate_provenance
  slsa-publish:
    name: SLSA Publish
    needs: [slsa-provenance]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # originally: v2.1.0
    with:
      base64-subjects: "${{ needs.slsa-provenance.outputs.hashes }}"
      upload-assets: true

    # ============================================================================
    # PROVISION K8S
    # ============================================================================
  provision-k8s-vps:
    name: Provision k3s Cluster on VPS
    runs-on: ubuntu-latest
    needs: [detect-changes, binary_build, docker, check, frontend]
    timeout-minutes: 120
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # originally: v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh add_vps_to_known_hosts
      - name: Make retry script executable
        run: chmod +x scripts/ssh-retry.sh
      - name: Configure swap on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh configure_swap
      - name: Check disk space on VPS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh check_disk_space
      - name: Install AmneziaWG systemd service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh install_amneziawg
      - name: Configure CPU governor and k3s watchdog
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh configure_cpu_governor
      - name: Configure Docker and System log rotation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh configure_docker_logs
      - name: Clean up old k3s
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'recreate-cluster'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh cleanup_old_k3s
      - name: Fix DNS resolv.conf permanently
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh fix_dns
      - name: Prepare k3s config on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh prepare_k3s_config
      - name: Restart k3s if config changed
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh restart_k3s_if_needed
      - name: Download k3s binary and install script
        run: bash scripts/ci/vps-provision.sh download_k3s
      - name: Upload k3s files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh upload_k3s_files
      - name: Install k3s on VPS
        env:
          SSH_RETRY_TIMEOUT: 600
          SSH_RETRY_MAX_ATTEMPTS: 5
          SSH_RETRY_DELAY_SECONDS: 15
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh install_k3s
      - name: Configure host-level disk encryption for k3s storage (fscrypt/dm-crypt)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh configure_disk_encryption
      - name: Cleanup disk space on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh cleanup_disk
      - name: Pre-pull system images via Docker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh pre_pull_system_images
      - name: Start and verify k3s
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh start_k3s
      - name: Limit k3s memory usage
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh limit_k3s_memory
      - name: Fix local-path-provisioner RBAC and ensure WaitForFirstConsumer binding mode
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/k8s-setup.sh fix_local_path_rbac
      - name: Ensure k3s certificates include domain and external IP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh ensure_k3s_certs
      - name: Install cert-manager and configure Let's Encrypt
        run: bash scripts/ci/k8s-setup.sh install_cert_manager
      - name: Setup DuckDNS auto-updater
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh setup_duckdns
      - name: Setup ML infrastructure directories
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh setup_ml_dirs
      - name: Deploy MLflow service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh deploy_mlflow
      - name: Setup Postgres automated backups
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh setup_postgres_backups
      - name: Deploy health check script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh deploy_health_script
      - name: Generate kubeconfig with external domain
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh generate_kubeconfig
      - name: Download kubeconfig artifact
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh download_kubeconfig
      - name: Upload kubeconfig artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # originally: v7
        with:
          name: kubeconfig
          path: ./k3s-config.yaml
          retention-days: 1

  # ============================================================================
  # DEPLOY STAGING
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging (k8s namespace)
    runs-on: ubuntu-latest
    needs:
      [
        detect-changes,
        binary_build,
        docker,
        provision-k8s-vps,
        check,
        frontend,
        smoke-test,
      ]
    timeout-minutes: 60
    environment: staging
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - name: Make retry script executable
        run: chmod +x scripts/ssh-retry.sh
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # originally: v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh add_vps_to_known_hosts
      - name: Download kubeconfig artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # originally: v8
        with:
          name: kubeconfig
          path: ./kubeconfig
      - name: Resolve VPS hostname and add to /etc/hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh resolve_vps_hostname
      - name: Configure kubectl
        run: bash scripts/ci/ci-helpers.sh configure_kubectl
      - name: Create staging namespace and image pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/ci/deploy-staging.sh create_namespace
      - name: Update image tags to SHA for staging
        run: bash scripts/ci/deploy-staging.sh update_image_tags
      - name: Wait for staging rollout
        run: bash scripts/ci/deploy-staging.sh wait_for_rollout
  # ============================================================================
  # TEST STAGING
  # ============================================================================
  test-staging:
    name: Test Staging (E2E)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    timeout-minutes: 20
    environment: staging
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Download kubeconfig artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # originally: v8
        with:
          name: kubeconfig
          path: ./kubeconfig
      - name: Configure kubectl
        run: bash scripts/ci/ci-helpers.sh configure_kubectl
      - name: Verify staging health
        run: bash scripts/ci/deploy-staging.sh verify_health
      - name: Run UAT tests against staging
        env:
          BASE_URL: "https://staging.fittpulse.duckdns.org"
          NAMESPACE: fitness-platform-staging
        run: bash scripts/ci/deploy-staging.sh run_uat_tests
  # ============================================================================
  # HEALTH CHECK
  # ============================================================================
  health-check:
    name: Server Health Check
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && needs.deploy-production.result == 'success'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # originally: v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh add_vps_to_known_hosts
      - name: Deploy health check script
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh deploy_health_script
      - name: Run immediate health check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh run_immediate_health_check
      - name: Setup daily health check cron
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh setup_health_cron
  # ============================================================================
  # CSP HEADERS CHECK
  # ============================================================================
  csp-headers-check:
    name: CSP Headers Check
    runs-on: ubuntu-latest
    needs: [provision-k8s-vps, health-check]
    if: always() && needs.provision-k8s-vps.result == 'success' && needs.health-check.result == 'success'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Check CSP and security headers
        env:
          CSP_DOMAIN: "https://${{ env.FITPULSE_DOMAIN }}"
        run: bash scripts/ci/verify.sh check_csp
  # ============================================================================
  # SMOKE TEST (TESTCONTAINERS)
  # ============================================================================
  smoke-test:
    name: Smoke Test (testcontainers-go)
    runs-on: ubuntu-latest
    needs: [detect-changes, binary_build, check]
    timeout-minutes: 20
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # originally: v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run testcontainers smoke test
        run: bash scripts/ci/test.sh run_smoke_tests
  # ============================================================================
  # DEPLOY PRODUCTION
  # ============================================================================
  deploy-production:
    name: Deploy to K8s Production
    runs-on: ubuntu-latest
    needs: [detect-changes, docker, provision-k8s-vps, test-staging]
    timeout-minutes: 90
    environment: production
    outputs:
      reachable: ${{ steps.connectivity.outputs.reachable }}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0
      - name: Make retry script executable
        run: chmod +x scripts/ssh-retry.sh
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # originally: v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh add_vps_to_known_hosts
      - name: Download kubeconfig artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # originally: v8
        with:
          name: kubeconfig
          path: ./kubeconfig
      - name: Resolve VPS hostname and add to /etc/hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh resolve_vps_hostname
      - name: Configure kubectl
        run: bash scripts/ci/ci-helpers.sh configure_kubectl
      - name: Wait for k3s API to be fully ready
        run: bash scripts/ci/ci-helpers.sh wait_for_k3s_api
      - name: Check cluster connectivity
        id: connectivity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh check_connectivity
      - name: Create image pull secret for GHCR
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/ci/deploy-production.sh create_image_pull_secret
      - name: Get short SHA
        if: steps.connectivity.outputs.reachable == 'true'
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push Open Wearables images
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/build-push.sh build_open_wearables
      - name: Ensure service account exists
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh ensure_service_account
      - name: Create production secrets
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          JWT_PUBLIC_KEY_PEM: ${{ secrets.JWT_PUBLIC_KEY_PEM }}
          OPEN_WEARABLES_WEBHOOK_SECRET: ${{ secrets.OPEN_WEARABLES_WEBHOOK_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
          VALKEY_PASSWORD: ${{ secrets.VALKEY_PASSWORD }}
        run: bash scripts/ci/deploy-production.sh create_secrets
      - name: Update image tags to SHA
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh update_image_tags
      - name: Cleanup disk space on VPS
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh cleanup_disk
      - name: Pre-pull application images on VPS
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh pre_pull_images
      - name: Ensure local-path-provisioner is running and StorageClass is ready
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/k8s-setup.sh setup_local_path_provisioner
      - name: Install/upgrade ingress-nginx (replaces Traefik)
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/k8s-setup.sh install_ingress_nginx
      - name: Cleanup Traefik from kube-system (optional)
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/k8s-setup.sh cleanup_traefik
      - name: Apply production overlay with Kustomize
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh apply_manifests
      - name: Wait for RabbitMQ to be ready
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh wait_for_rabbitmq
      - name: Verify Postgres StatefulSet
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh verify_postgres
      - name: Wait for Postgres PVC to be created and bound
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/verify.sh wait_for_pvc
      - name: Wait for Postgres to be ready
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/verify.sh wait_for_postgres
      - name: Run database migrations
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh run_migrations
      - name: Wait for postgres-service to be fully ready
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/verify.sh wait_for_service
      - name: Run seed-admin job
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: bash scripts/ci/deploy-production.sh run_seed_admin
      - name: Check service logs for errors
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh check_logs
      - name: Debug pod status after deploy
        if: always() && steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh debug_pod_status
      - name: Verify production deployment
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh verify_deployment
      - name: Deploy Open Wearables
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/deploy-production.sh deploy_open_wearables
  # ============================================================================
  # TEST PRODUCTION
  # ============================================================================
  test-production:
    name: Test Production (E2E)
    runs-on: ubuntu-latest
    needs: [deploy-production]
    timeout-minutes: 30
    env:
      PRODUCTION_URL: ${VPS_HOST}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Download kubeconfig artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # originally: v8
        with:
          name: kubeconfig
          path: ./kubeconfig
      - name: Configure kubectl
        run: bash scripts/ci/ci-helpers.sh configure_kubectl
      - name: Prepare target URL
        id: target
        run: bash scripts/ci/ci-helpers.sh prepare_target_url
      - name: Verify SSL Certificate
        run: bash scripts/ci/verify.sh check_ssl
      - name: Health check
        run: bash scripts/ci/verify.sh health_check
      - name: Run UAT tests
        run: |
          python scripts/api-test.py --base-url "${{ steps.target.outputs.target }}"
      - name: Performance test (k6)
        uses: k6io/action@e4714b734f2b0afaabeb7b4a69142745548ab9ec # originally: v0.3.1
        with:
          filename: load-test.k6
        env:
          BASE_URL: ${{ steps.target.outputs.target }}

  # ============================================================================
  # NOTIFY
  # ============================================================================
  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        validate-workflow,
        dockerfile-lint,
        super-linter,
        frontend,
        check,
        binary_build,
        docker,
        codeql,
        kubescape,
        security-scan,
        sonarcloud,
        conventional-commits,
        kube-bench,
        kube-hunter,
        checkov,
        cosign-verify,
        provision-k8s-vps,
        deploy-staging,
        test-staging,
        deploy-production,
        test-production,
        smoke-test,
        health-check,
        csp-headers-check,
        semgrep,
        osv-scanner,
        fuzz-tests,
        osv-audit,
        dependency-review,
      ]
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
      - name: Collect job statuses
        id: statuses
        env:
          JOB_STATUS_VALIDATE_WORKFLOW: ${{ needs.validate-workflow.result }}
          JOB_STATUS_DOCKERFILE_LINT: ${{ needs.dockerfile-lint.result }}
          JOB_STATUS_SUPER_LINTER: ${{ needs.super-linter.result }}
          JOB_STATUS_FRONTEND: ${{ needs.frontend.result }}
          JOB_STATUS_CHECK: ${{ needs.check.result }}
          JOB_STATUS_BINARY_BUILD: ${{ needs.binary_build.result }}
          JOB_STATUS_DOCKER: ${{ needs.docker.result }}
          JOB_STATUS_CODEQL: ${{ needs.codeql.result }}
          JOB_STATUS_KUBESCAPE: ${{ needs.kubescape.result }}
          JOB_STATUS_SECURITY_SCAN: ${{ needs.security-scan.result }}
          JOB_STATUS_SONARCLOUD: ${{ needs.sonarcloud.result }}
          JOB_STATUS_CONVENTIONAL_COMMITS: ${{ needs.conventional-commits.result }}
          JOB_STATUS_KUBE_BENCH: ${{ needs.kube-bench.result }}
          JOB_STATUS_KUBE_HUNTER: ${{ needs.kube-hunter.result }}
          JOB_STATUS_CHECKOV: ${{ needs.checkov.result }}
          JOB_STATUS_COSIGN_VERIFY: ${{ needs.cosign-verify.result }}
          JOB_STATUS_PROVISION_K8S_VPS: ${{ needs.provision-k8s-vps.result }}
          JOB_STATUS_DEPLOY_STAGING: ${{ needs['deploy-staging'].result }}
          JOB_STATUS_TEST_STAGING: ${{ needs['test-staging'].result }}
          JOB_STATUS_DEPLOY_PRODUCTION: ${{ needs['deploy-production'].result }}
          JOB_STATUS_TEST_PRODUCTION: ${{ needs['test-production'].result }}
          JOB_STATUS_SMOKE_TEST: ${{ needs['smoke-test'].result }}
          JOB_STATUS_HEALTH_CHECK: ${{ needs.health-check.result }}
          JOB_STATUS_CSP_HEADERS_CHECK: ${{ needs.csp-headers-check.result }}
          JOB_STATUS_SEMGREP: ${{ needs.semgrep.result }}
          JOB_STATUS_OSV_SCANNER: ${{ needs.osv-scanner.result }}
          JOB_STATUS_FUZZ_TESTS: ${{ needs.fuzz-tests.result }}
          JOB_STATUS_OSV_AUDIT: ${{ needs.osv-audit.result }}
          JOB_STATUS_DEPENDENCY_REVIEW: ${{ needs['dependency-review'].result }}
        run: bash scripts/ci/ci-helpers.sh collect_statuses
      - name: Send to Telegram
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # originally: v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            <b>CI/CD — ${{ steps.statuses.outputs.overall }}</b>
            <code>${{ github.repository }}</code> @ <code>${{ github.ref_name }}</code>
            Commit: <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">{{ github.sha }}</a>
            <b>Проверки:</b>
            ${{ steps.statuses.outputs.validate }} Validate Workflow
            ${{ steps.statuses.outputs.dockerfile_lint }} Dockerfile Lint
            ${{ steps.statuses.outputs.super_linter }} Super Linter
            ${{ steps.statuses.outputs.frontend }} Frontend
            ${{ steps.statuses.outputs.check }} Make Check
            ${{ steps.statuses.outputs.conventional }} Conventional Commits
            <b>Безопасность:</b>
            ${{ steps.statuses.outputs.codeql }} CodeQL
            ${{ steps.statuses.outputs.kubescape }} Kubescape
            ${{ steps.statuses.outputs.security_scan }} Security Scan
            ${{ steps.statuses.outputs.sonarcloud }} SonarCloud
            ${{ steps.statuses.outputs.kube_bench }} Kube-Bench
            ${{ steps.statuses.outputs.kube_hunter }} Kube-Hunter
            ${{ steps.statuses.outputs.checkov }} Checkov
            ${{ steps.statuses.outputs.cosign_verify }} Cosign Verify
            <b>Деплой:</b>
            ${{ steps.statuses.outputs.build }} Build Binaries
            ${{ steps.statuses.outputs.docker }} Docker Build & Push
            ${{ steps.statuses.outputs.provision_k8s }} Provision K8s on VPS
            ${{ steps.statuses.outputs.deploy_staging }} Deploy Staging
            ${{ steps.statuses.outputs.test_staging }} Test Staging
            ${{ steps.statuses.outputs.deploy_prod }} Deploy Production
            ${{ steps.statuses.outputs.test_prod }} Test Production
            ${{ steps.statuses.outputs.smoke_test }} Smoke Test
            ${{ steps.statuses.outputs.health_check }} Health Check
            ${{ steps.statuses.outputs.csp_check }} CSP Headers Check
            🌐 <b>Сайт:</b> https://${{ env.FITPULSE_DOMAIN }}
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Открыть запуск</a>

  # ============================================================================
  # DEPENDABOT AUTO-MERGE
  # ============================================================================
  dependabot-auto-merge:
    name: Dependabot auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
    steps:
      - name: Enable auto-merge for Dependabot PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${GITHUB_TOKEN}
        run: gh pr merge --auto --squash "$PR_URL"
      - name: Auto-approve minor/patch updates
        if: contains(github.event.pull_request.title, 'minor') || contains(github.event.pull_request.title, 'patch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${GITHUB_TOKEN}
        run: gh pr review --approve "$PR_URL"
