name: Documentation Check

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - ".github/dependabot.yml"
      - ".github/workflows/*.yml"
      - "Dockerfile"
      - "cmd/**/Dockerfile"
      - "configs/**"
      - "web/package.json"
      - "Makefile"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - ".github/dependabot.yml"
      - ".github/workflows/*.yml"
      - "Dockerfile"
      - "cmd/**/Dockerfile"
      - "configs/**"
      - "web/package.json"
      - "Makefile"
  schedule:
    - cron: "0 0 * * 0" # Weekly Sunday midnight
  workflow_dispatch:

jobs:
  docs-check:
    name: Documentation Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # originally: v7
        with:
          fetch-depth: 0

      - name: Check for version consistency
        run: |
          echo "-> Checking PostgreSQL version references..."
          PG_REFS=$(grep -rn "postgres:1[0-7]\|pg1[0-7]\|PostgreSQL 1[0-7]\|version: \"1[0-7]\"\|version: '1[0-7]'" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --include="*.jsx" --include="*.js" --include="*.json" --exclude-dir="datasets" || true)
          if [ -n "$PG_REFS" ]; then
            echo "❌ Found outdated PostgreSQL references (current: 18+):"
            echo "$PG_REFS"
            exit 1
          fi
          echo "✅ PostgreSQL version references are consistent (18+)"

          echo "-> Checking Kubernetes version references..."
          K8S_REFS=$(grep -rn "v1\.\(2[0-9]\|3[0-5]\)\|Kubernetes 1\.\(2[0-9]\|3[0-5]\)\|Kubernetes-1\.\(2[0-9]\|3[0-5]\)" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --exclude-dir="datasets" || true)
          if [ -n "$K8S_REFS" ]; then
            echo "❌ Found outdated Kubernetes references (current: 1.36+):"
            echo "$K8S_REFS"
            exit 1
          fi
          echo "✅ Kubernetes version references are consistent (1.36+)"

          echo "-> Checking Debian version references..."
          DEBIAN_REFS=$(grep -rn "debian:1[0-2]\|Debian 1[0-2]\|debian 1[0-2]\|bookworm" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --exclude-dir=".github" --exclude-dir="datasets" || true)
          if [ -n "$DEBIAN_REFS" ]; then
            echo "❌ Found outdated Debian references (current: 13+):"
            echo "$DEBIAN_REFS"
            exit 1
          fi
          echo "✅ Debian version references are consistent (13+)"

          echo "-> Checking Alpine version references..."
          ALPINE_REFS=$(grep -rn "alpine:3\.[0-9]\+\b" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --exclude-dir="datasets" | grep -v "^\s*#" | grep -v "3\.2[4-9]\|3\.3[0-9]" || true)
          if [ -n "$ALPINE_REFS" ]; then
            echo "❌ Found outdated Alpine references (current: 3.24+):"
            echo "$ALPINE_REFS"
            exit 1
          fi
          echo "✅ Alpine version references are consistent (3.24+)"

          echo "-> Checking Go version references..."
          GO_REFS=$(grep -rn "golang:1\.[0-9]\+\b" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --exclude-dir="datasets" | grep -v "^\s*#" | grep -v "1\.2[6-9]\|1\.[3-9][0-9]" || true)
          if [ -n "$GO_REFS" ]; then
            echo "❌ Found outdated Go references (current: 1.26+):"
            echo "$GO_REFS"
            exit 1
          fi
          echo "✅ Go version references are consistent (1.26+)"

          echo "-> Checking GO_VERSION in Makefile..."
          MAKE_GO_VERSION=$(grep -E '^GO_VERSION[[:space:]]*:=' Makefile | head -1 | sed -E 's/.*([0-9]+\.[0-9]+\.[0-9]+).*/\1/' || true)
          if [ -n "$MAKE_GO_VERSION" ]; then
            MAJOR=$(echo "$MAKE_GO_VERSION" | cut -d. -f1)
            MINOR=$(echo "$MAKE_GO_VERSION" | cut -d. -f2)
            if [ "$MAJOR" -lt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -lt 26 ]; }; then
              echo "❌ Found outdated GO_VERSION in Makefile: $MAKE_GO_VERSION (current: 1.26+)"
              exit 1
            fi
            echo "✅ GO_VERSION in Makefile is consistent ($MAKE_GO_VERSION)"
          else
            echo "⚠️  GO_VERSION not found in Makefile"
          fi

          echo "-> Checking Python version references..."
          PYTHON_REFS=$(grep -rn "python:3\.[0-9]\+\b" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --exclude-dir="datasets" | grep -v "^\s*#" | grep -v "3\.1[4-9]\|3\.[2-9][0-9]" || true)
          if [ -n "$PYTHON_REFS" ]; then
            echo "❌ Found outdated Python references (current: 3.14+):"
            echo "$PYTHON_REFS"
            exit 1
          fi
          echo "✅ Python version references are consistent (3.14+)"

          echo "-> Checking Valkey version references..."
          VALKEY_REFS=$(grep -rn "valkey/valkey:[1-8]\b\|valkey:[1-8]\b" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --exclude-dir="datasets" || true)
          if [ -n "$VALKEY_REFS" ]; then
            echo "❌ Found outdated Valkey references (current: 9+):"
            echo "$VALKEY_REFS"
            exit 1
          fi
          echo "✅ Valkey version references are consistent (9+)"

          echo "-> Checking RabbitMQ version references..."
          RABBITMQ_REFS=$(grep -rn "rabbitmq:[1-3]\.[0-9]\|rabbitmq:4\.[0-2]\b" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --exclude-dir="datasets" || true)
          if [ -n "$RABBITMQ_REFS" ]; then
            echo "❌ Found outdated RabbitMQ references (current: 4.3+):"
            echo "$RABBITMQ_REFS"
            exit 1
          fi
          echo "✅ RabbitMQ version references are consistent (4.3+)"

          echo "-> Checking Node.js version references..."
          NODE_REFS=$(grep -rn "node:2[0-9]\|Node\.js\s\+2[0-9]\|node\s\+2[0-9]\|Node\.js\s\+24\|node\s\+24" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --include="*.jsx" --include="*.js" --include="*.json" --exclude-dir="datasets" | grep -v "node:2[6-9]\|Node\.js\s\+2[6-9]\|node\s\+2[6-9]" || true)
          if [ -n "$NODE_REFS" ]; then
            echo "❌ Found outdated Node.js references (current: 26+):"
            echo "$NODE_REFS"
            exit 1
          fi
          echo "✅ Node.js version references are consistent (26+)"

          echo "-> Checking Ubuntu version references..."
          UBUNTU_REFS=$(grep -rn "ubuntu:1[0-9]\.[0-9]\+\|ubuntu:2[0-5]\.[0-9]\+\|Ubuntu\s\+1[0-9]\b\|Ubuntu\s\+2[0-5]\b" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --exclude-dir="datasets" || true)
          if [ -n "$UBUNTU_REFS" ]; then
            echo "❌ Found outdated Ubuntu references (current: 26.04+):"
            echo "$UBUNTU_REFS"
            exit 1
          fi
          echo "✅ Ubuntu version references are consistent (26.04+)"

          echo "-> Checking React version references..."
          REACT_REFS=$(grep -rn "react:1[0-8]\|React\s\+1[0-8]\|react\s\+1[0-8]" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --include="*.jsx" --include="*.js" --include="*.json" --exclude-dir="datasets" || true)
          if [ -n "$REACT_REFS" ]; then
            echo "❌ Found outdated React references (current: 19+):"
            echo "$REACT_REFS"
            exit 1
          fi
          echo "✅ React version references are consistent (19+)"

          echo "-> Checking Vite version references..."
          VITE_REFS=$(grep -rn "vite:7\|Vite\s\+7\|vite\s\+7" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --include="*.jsx" --include="*.js" --include="*.json" --exclude-dir=".github" --exclude-dir="datasets" || true)
          if [ -n "$VITE_REFS" ]; then
            echo "❌ Found outdated Vite references (current: 8+):"
            echo "$VITE_REFS"
            exit 1
          fi
          echo "✅ Vite version references are consistent (8+)"

          echo "-> Checking Chart.js version references..."
          CHART_REFS=$(grep -rn "chart\.js:3\|Chart\.js\s\+3\|chart\.js\s\+3" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --include="*.jsx" --include="*.js" --include="*.json" --exclude-dir="datasets" || true)
          if [ -n "$CHART_REFS" ]; then
            echo "❌ Found outdated Chart.js references (current: 4+):"
            echo "$CHART_REFS"
            exit 1
          fi
           echo "✅ Chart.js version references are consistent (4+)"

          echo "-> Checking Biome version references..."
           BIOME_REFS=$(grep -rn "@biomejs/biome:[12]\.[0-9]\+\|Biome\s\+[12]\.[0-9]\+\|biome\s\+[12]\.[0-9]\+" . --include="*.yml" --include="*.yaml" --include="*.md" --include="*.go" --include="Dockerfile" --include="*.jsx" --include="*.js" --include="*.json" --exclude-dir="datasets" | grep -vE "2\.[5-9](\.[0-9]+)?" || true)
          if [ -n "$BIOME_REFS" ]; then
            echo "❌ Found outdated Biome references (current: 2.5+):"
            echo "$BIOME_REFS"
            exit 1
          fi
           echo "✅ Biome version references are consistent (2.5+)"

          echo "-> Checking Go tools versions..."
          GO_TOOLS_REFS=$(grep -rn "go install.*@latest" . --include="*.md" --include="*.sh" --include="Makefile" --include="*.ps1" --include="*.bash" --exclude-dir=".github" --exclude-dir="node_modules" --exclude-dir="web/node_modules" --exclude-dir="datasets" || true)
          if [ -n "$GO_TOOLS_REFS" ]; then
            echo "❌ Found unpinned Go tool versions (@latest) in local development files:"
            echo "$GO_TOOLS_REFS"
            echo "   Pin versions explicitly, e.g. @v1.36.6 instead of @latest"
            exit 1
          fi
          echo "✅ Go tools versions are pinned"

      - name: Check docs ↔ code version consistency
        run: |
          echo "-> Checking PostgreSQL version consistency across docs and code..."
          DOC_PG=$(grep -oP 'postgres:\K[0-9]+' docs/ARCHITECTURE.md configs/k8s/base/deployments/postgres.yaml cmd/data-processor/data_processor_integration_test.go internal/testcontainers/containers.go 2>/dev/null | sort -u | head -1)
          CODE_PG=$(grep -oP 'postgres:\K[0-9]+' configs/k8s/base/deployments/postgres.yaml cmd/data-processor/data_processor_integration_test.go internal/testcontainers/containers.go 2>/dev/null | sort -u | head -1)
          if [ -n "$DOC_PG" ] && [ -n "$CODE_PG" ] && [ "$DOC_PG" != "$CODE_PG" ]; then
            echo "❌ PostgreSQL version mismatch: docs=$DOC_PG, code=$CODE_PG"
            exit 1
          fi
          echo "✅ PostgreSQL versions are consistent"

          echo "-> Checking Valkey version consistency across docs and code..."
          DOC_VALKEY=$(grep -oP 'valkey/valkey:\K[0-9]+' docs/ARCHITECTURE.md configs/k8s/base/deployments/valkey.yaml internal/testcontainers/containers.go docs/adr/0002-valkey-migration.md 2>/dev/null | sort -u | head -1)
          CODE_VALKEY=$(grep -oP 'valkey/valkey:\K[0-9]+' configs/k8s/base/deployments/valkey.yaml internal/testcontainers/containers.go 2>/dev/null | sort -u | head -1)
          if [ -n "$DOC_VALKEY" ] && [ -n "$CODE_VALKEY" ] && [ "$DOC_VALKEY" != "$CODE_VALKEY" ]; then
            echo "❌ Valkey version mismatch: docs=$DOC_VALKEY, code=$CODE_VALKEY"
            exit 1
          fi
          echo "✅ Valkey versions are consistent"

          echo "-> Checking RabbitMQ version consistency across docs and code..."
          DOC_RABBIT=$(grep -oP 'rabbitmq:\K[0-9.]+' docs/ARCHITECTURE.md configs/k8s/base/deployments/rabbitmq-statefulset.yaml cmd/data-processor/data_processor_integration_test.go internal/testcontainers/containers.go 2>/dev/null | sort -u | head -1)
          CODE_RABBIT=$(grep -oP 'rabbitmq:\K[0-9.]+' configs/k8s/base/deployments/rabbitmq-statefulset.yaml cmd/data-processor/data_processor_integration_test.go internal/testcontainers/containers.go 2>/dev/null | sort -u | head -1)
          if [ -n "$DOC_RABBIT" ] && [ -n "$CODE_RABBIT" ] && [ "$DOC_RABBIT" != "$CODE_RABBIT" ]; then
            echo "❌ RabbitMQ version mismatch: docs=$DOC_RABBIT, code=$CODE_RABBIT"
            exit 1
          fi
          echo "✅ RabbitMQ versions are consistent"

      - name: Check markdown links
        run: |
          echo "-> Checking for broken markdown links..."
          BROKEN_LINKS=$(find docs -name "*.md" -exec grep -Hn "\[.*\](" {} \; 2>/dev/null \
            | grep -v "http" \
            | grep -v "mailto:" \
            | grep -vE '\./|\.\./' \
            | head -20 || true)
          if [ -n "$BROKEN_LINKS" ]; then
            echo "⚠️  Found suspicious markdown links (verify manually):"
            echo "$BROKEN_LINKS"
          else
            echo "✅ No obvious broken relative markdown links found"
          fi

      - name: Check ADR consistency
        run: |
          echo "-> Checking ADR files..."
          ADR_COUNT=$(find docs/adr -name "*.md" | wc -l)
          echo "Found $ADR_COUNT ADR files"
          for adr in docs/adr/*.md; do
            if [ -f "$adr" ]; then
              BASENAME=$(basename "$adr")
              if [[ ! "$BASENAME" =~ ^[0-9]{4}- ]]; then
                echo "⚠️  ADR file missing numeric prefix: $adr"
              fi
            fi
          done
          echo "✅ ADR consistency check complete"

      - name: Check GitHub Actions are SHA-pinned and not stale
        run: |
          echo "-> Checking GitHub Actions references are SHA-pinned..."

          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml)

          FAIL=0
          declare -A warned_actions

          for wf in "${workflow_files[@]}"; do
            echo "  Scanning $wf..."
            
            if grep -nE 'uses:\s+.+@(v\d|latest|master|main|develop)\b' "$wf" > /tmp/mutable_refs.txt 2>/dev/null; then
              echo "❌ FAIL: Found mutable tag references in $wf:"
              sed 's/^/    /' /tmp/mutable_refs.txt
              FAIL=1
            fi
            
            while IFS= read -r line; do
              if [[ $line =~ uses:\ ([^@]+)@([0-9a-f]{40}) ]]; then
                repo="${BASH_REMATCH[1]}"
                sha="${BASH_REMATCH[2]}"
                key="${repo}@${sha}"
                
                if [[ -z "${warned_actions[$key]+x}" ]]; then
                  warned_actions[$key]=1
                  
                  tag_version=$(echo "$line" | grep -oP '# originally: \K.+' | head -1)
                  
                  if [ -n "$tag_version" ]; then
                    tag_sha=$(git ls-remote --tags "https://github.com/$repo.git" "refs/tags/$tag_version" 2>/dev/null | grep -v '\^{}' | head -1 | awk '{print $1}')
                    
                    if [ -n "$tag_sha" ] && [ "$sha" != "$tag_sha" ]; then
                      echo "⚠️  WARNING: $wf uses $repo@$sha but tag $tag_version HEAD is now $tag_sha"
                      echo "    The pinned SHA no longer matches the tag. The tag may have been moved (supply-chain risk). Update the SHA if this is a legitimate new release."
                    fi
                  fi
                fi
              fi
            done < <(grep -E 'uses:\ .+@[0-9a-f]{40}' "$wf")
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "❌ FAIL: GitHub Actions are not fully SHA-pinned."
            echo "   Pin each 'uses:' reference to a full 40-character commit SHA."
            exit 1
          fi

          echo "✅ All GitHub Actions are SHA-pinned and consistent"

      - name: Documentation status
        run: |
          echo "============================================"
          echo "  Documentation Check PASSED"
          echo "============================================"
